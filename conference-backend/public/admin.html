<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — The 1st East Africa Bio-Inputs Conference 2027</title>
<style>
  :root {
    --loam: #163762;
    --moss: #72B846;
    --moss-dark: #5C9838;
    --parchment: #F6F3EC;
    --paper: #FFFFFF;
    --ink: #1A1A1A;
    --ink-soft: #5c5c5c;
    --line: #DAD2C0;
    --error: #A23E2E;
    --pending: #B08A2E;
    --verified: #4B5D3A;
    --rejected: #A23E2E;
    --submitted: #2E6FA2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--parchment);
    color: var(--ink);
    font-family: "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
  }
  header.masthead {
    background: var(--loam);
    color: #fff;
    padding: 1.25rem 1.5rem;
    border-bottom: 5px solid var(--moss);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  header.masthead h1 { font-size: 1.15rem; margin: 0; font-weight: 600; }
  header.masthead .sub { font-size: 0.78rem; color: #cfe0c9; }
  #logout-btn {
    background: none;
    border: 1px solid rgba(255,255,255,0.4);
    color: #fff;
    padding: 0.4rem 0.9rem;
    border-radius: 3px;
    cursor: pointer;
    font-size: 0.85rem;
    display: none;
  }

  main { max-width: 1000px; margin: 0 auto; padding: 1.75rem 1.25rem 4rem; }

  /* ---- Login ---- */
  #login-view { max-width: 360px; margin: 3rem auto 0; }
  #login-view h2 { font-size: 1.1rem; margin-bottom: 1rem; }
  .field { margin-bottom: 1rem; }
  label { display: block; font-size: 0.8rem; color: var(--ink-soft); margin-bottom: 0.3rem; }
  input[type="text"], input[type="password"], input[type="number"] {
    width: 100%;
    padding: 0.6rem 0.65rem;
    font-size: 0.95rem;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--paper);
  }
  button.primary {
    background: var(--moss);
    color: #fff;
    border: none;
    padding: 0.65rem 1.3rem;
    font-size: 0.92rem;
    font-weight: 600;
    border-radius: 3px;
    cursor: pointer;
  }
  button.primary:hover { background: var(--moss-dark); }
  button.primary:disabled { opacity: 0.6; cursor: default; }

  .msg { font-size: 0.85rem; padding: 0.6rem 0.8rem; border-radius: 3px; margin-top: 0.8rem; display: none; }
  .msg.error { background: #F4E4E0; color: var(--error); border-left: 3px solid var(--error); display: block; }
  .msg.success { background: #E7EEDF; color: var(--moss-dark); border-left: 3px solid var(--moss); display: block; }

  /* ---- Dashboard ---- */
  #dashboard-view { display: none; }

  .tabs { display: flex; gap: 1.5rem; border-bottom: 1px solid var(--line); margin-bottom: 1.25rem; }
  .tab { background: none; border: none; padding: 0.6rem 0; font-size: 0.95rem; color: var(--ink-soft); cursor: pointer; border-bottom: 3px solid transparent; font-weight: 500; }
  .tab.active { color: var(--loam); border-bottom-color: var(--moss); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .toolbar { display: flex; gap: 0.6rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
  select { padding: 0.5rem 0.6rem; border: 1px solid var(--line); border-radius: 3px; font-size: 0.88rem; background: var(--paper); }
  button.small {
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 0.45rem 0.9rem;
    border-radius: 3px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  button.small:hover { background: #eee9dc; }

  table { width: 100%; border-collapse: collapse; font-size: 0.86rem; background: var(--paper); }
  th, td { text-align: left; padding: 0.55rem 0.6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 0.75rem; text-transform: uppercase; color: var(--ink-soft); letter-spacing: 0.02em; }

  .status-pill {
    display: inline-block;
    padding: 0.15rem 0.55rem;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
    color: #fff;
  }
  .status-pill.pending { background: var(--pending); }
  .status-pill.payment_submitted { background: var(--submitted); }
  .status-pill.verified { background: var(--verified); }
  .status-pill.rejected { background: var(--rejected); }

  .row-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  button.verify-btn { background: var(--moss); color: #fff; border: none; padding: 0.35rem 0.7rem; border-radius: 3px; font-size: 0.78rem; cursor: pointer; }
  button.verify-btn:hover { background: var(--moss-dark); }
  button.reject-btn { background: var(--paper); color: var(--error); border: 1px solid var(--error); padding: 0.35rem 0.7rem; border-radius: 3px; font-size: 0.78rem; cursor: pointer; }
  button.reject-btn:hover { background: #F4E4E0; }

  .empty-note { color: var(--ink-soft); font-size: 0.88rem; padding: 1rem 0; }

  .settings-card { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 1rem 1.25rem; margin-bottom: 1rem; max-width: 420px; }
  .settings-card h3 { margin: 0 0 0.75rem; font-size: 0.95rem; }
  .settings-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.6rem; }
  .settings-row label { flex: 1; margin: 0; font-size: 0.85rem; color: var(--ink); }
  .settings-row input { width: 110px; }
  .settings-row button { flex-shrink: 0; }
</style>
</head>
<body>

<header class="masthead">
  <div>
    <h1>Bio-Inputs Conference — Admin</h1>
    <div class="sub">The 1st East Africa Bio-Inputs Conference 2027</div>
  </div>
  <button id="logout-btn">Log out</button>
</header>

<main>

  <!-- LOGIN -->
  <div id="login-view">
    <h2>Admin Login</h2>
    <form id="login-form">
      <div class="field">
        <label for="login-username">Username</label>
        <input type="text" id="login-username" required />
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required />
      </div>
      <button type="submit" class="primary" id="login-btn">Log in</button>
      <div class="msg" id="login-msg"></div>
    </form>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard-view">
    <div class="tabs">
      <button class="tab active" data-tab="participants">Participants</button>
      <button class="tab" data-tab="exhibitors">Exhibitors</button>
      <button class="tab" data-tab="settings">Settings</button>
    </div>

    <!-- PARTICIPANTS -->
    <section class="tab-panel active" id="panel-participants">
      <div class="toolbar">
        <select id="p-filter">
          <option value="">All statuses</option>
          <option value="pending">Pending</option>
          <option value="payment_submitted">Payment submitted</option>
          <option value="verified">Verified</option>
          <option value="rejected">Rejected</option>
        </select>
        <button class="small" id="p-refresh">Refresh</button>
      </div>
      <div id="p-table-wrap"></div>
    </section>

    <!-- EXHIBITORS -->
    <section class="tab-panel" id="panel-exhibitors">
      <div class="toolbar">
        <select id="e-filter">
          <option value="">All statuses</option>
          <option value="pending">Pending</option>
          <option value="payment_submitted">Payment submitted</option>
          <option value="verified">Verified</option>
          <option value="rejected">Rejected</option>
        </select>
        <button class="small" id="e-refresh">Refresh</button>
      </div>
      <div id="e-table-wrap"></div>
    </section>

    <!-- SETTINGS -->
    <section class="tab-panel" id="panel-settings">
      <div class="settings-card">
        <h3>Exhibitor Fee</h3>
        <div class="settings-row">
          <label for="fee-input">Fee (all exhibitors)</label>
          <input type="number" id="fee-input" step="0.01" />
          <button class="small" id="fee-save">Save</button>
        </div>
        <div class="msg" id="fee-msg"></div>
      </div>

      <div class="settings-card" style="max-width: 520px;">
        <h3>Participant Category Prices</h3>
        <div id="category-rows"></div>
        <div class="msg" id="category-msg"></div>
      </div>
    </section>
  </div>

</main>

<script>
  const API_BASE = '/api';
  let TOKEN = null;

  // ---------- Login ----------
  const loginView = document.getElementById('login-view');
  const dashboardView = document.getElementById('dashboard-view');
  const logoutBtn = document.getElementById('logout-btn');
  const loginForm = document.getElementById('login-form');
  const loginMsg = document.getElementById('login-msg');
  const loginBtn = document.getElementById('login-btn');

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginMsg.className = 'msg';
    loginMsg.textContent = '';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Logging in…';

    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;

    try {
      const res = await fetch(`${API_BASE}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();

      if (res.ok && data.token) {
        TOKEN = data.token;
        loginView.style.display = 'none';
        dashboardView.style.display = 'block';
        logoutBtn.style.display = 'inline-block';
        loadParticipants();
        loadExhibitors();
        loadSettings();
      } else {
        loginMsg.className = 'msg error';
        loginMsg.textContent = data.error || 'Login failed. Check your username and password.';
      }
    } catch (err) {
      loginMsg.className = 'msg error';
      loginMsg.textContent = 'Could not reach the server.';
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Log in';
    }
  });

  logoutBtn.addEventListener('click', () => {
    TOKEN = null;
    dashboardView.style.display = 'none';
    logoutBtn.style.display = 'none';
    loginView.style.display = 'block';
    document.getElementById('login-password').value = '';
  });

  // ---------- Tabs ----------
  document.querySelectorAll('.tab').forEach(tabBtn => {
    tabBtn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      tabBtn.classList.add('active');
      document.getElementById(`panel-${tabBtn.dataset.tab}`).classList.add('active');
    });
  });

  // ---------- Helpers ----------
  function authHeaders() {
    return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` };
  }

  function statusPill(status) {
    return `<span class="status-pill ${status}">${status.replace('_', ' ')}</span>`;
  }

  function renderActions(type, id, status) {
    if (status === 'verified' || status === 'rejected') return '—';
    return `
      <div class="row-actions">
        <button class="verify-btn" onclick="verifyRecord('${type}', ${id})">Verify</button>
        <button class="reject-btn" onclick="rejectRecord('${type}', ${id})">Reject</button>
      </div>
    `;
  }

  // ---------- Participants ----------
  async function loadParticipants() {
    const status = document.getElementById('p-filter').value;
    const url = status ? `${API_BASE}/admin/participants?status=${status}` : `${API_BASE}/admin/participants`;
    const wrap = document.getElementById('p-table-wrap');
    wrap.innerHTML = '<p class="empty-note">Loading…</p>';

    try {
      const res = await fetch(url, { headers: authHeaders() });
      const rows = await res.json();

      if (!Array.isArray(rows) || rows.length === 0) {
        wrap.innerHTML = '<p class="empty-note">No participants found.</p>';
        return;
      }

      wrap.innerHTML = `
        <table>
          <thead>
            <tr><th>Name</th><th>Email</th><th>Organization</th><th>Payment ref</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <td>${r.full_name}</td>
                <td>${r.email}</td>
                <td>${r.organization || '—'}</td>
                <td>${r.payment_reference || '—'}</td>
                <td>${statusPill(r.status)}</td>
                <td>${renderActions('participant', r.id, r.status)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    } catch (err) {
      wrap.innerHTML = '<p class="empty-note">Could not load participants.</p>';
    }
  }

  document.getElementById('p-refresh').addEventListener('click', loadParticipants);
  document.getElementById('p-filter').addEventListener('change', loadParticipants);

  // ---------- Exhibitors ----------
  async function loadExhibitors() {
    const status = document.getElementById('e-filter').value;
    const url = status ? `${API_BASE}/admin/exhibitors?status=${status}` : `${API_BASE}/admin/exhibitors`;
    const wrap = document.getElementById('e-table-wrap');
    wrap.innerHTML = '<p class="empty-note">Loading…</p>';

    try {
      const res = await fetch(url, { headers: authHeaders() });
      const rows = await res.json();

      if (!Array.isArray(rows) || rows.length === 0) {
        wrap.innerHTML = '<p class="empty-note">No exhibitors found.</p>';
        return;
      }

      wrap.innerHTML = `
        <table>
          <thead>
            <tr><th>Name</th><th>Email</th><th>Organization</th><th>Payment ref</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <td>${r.full_name}</td>
                <td>${r.email}</td>
                <td>${r.organization || '—'}</td>
                <td>${r.payment_reference || '—'}</td>
                <td>${statusPill(r.status)}</td>
                <td>${renderActions('exhibitor', r.id, r.status)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    } catch (err) {
      wrap.innerHTML = '<p class="empty-note">Could not load exhibitors.</p>';
    }
  }

  document.getElementById('e-refresh').addEventListener('click', loadExhibitors);
  document.getElementById('e-filter').addEventListener('change', loadExhibitors);

  // ---------- Verify / Reject ----------
  async function verifyRecord(type, id) {
    const ref = prompt('Confirm or enter the payment reference for this record (leave blank to keep existing):');
    if (ref === null) return; // cancelled

    try {
      const res = await fetch(`${API_BASE}/admin/${type}s/${id}/verify`, {
        method: 'PATCH',
        headers: authHeaders(),
        body: JSON.stringify(ref ? { payment_reference: ref } : {}),
      });
      const data = await res.json();

      if (!res.ok) {
        alert(data.error || 'Something went wrong verifying this record.');
        return;
      }

      type === 'participant' ? loadParticipants() : loadExhibitors();
    } catch (err) {
      alert('Could not reach the server.');
    }
  }

  async function rejectRecord(type, id) {
    if (!confirm('Reject this registration?')) return;

    try {
      const res = await fetch(`${API_BASE}/admin/${type}s/${id}/reject`, {
        method: 'PATCH',
        headers: authHeaders(),
      });
      const data = await res.json();

      if (!res.ok) {
        alert(data.error || 'Something went wrong rejecting this record.');
        return;
      }

      type === 'participant' ? loadParticipants() : loadExhibitors();
    } catch (err) {
      alert('Could not reach the server.');
    }
  }

  // ---------- Settings ----------
  async function loadSettings() {
    // Exhibitor fee
    try {
      const res = await fetch(`${API_BASE}/exhibitors/fee`);
      const data = await res.json();
      if (res.ok) document.getElementById('fee-input').value = parseFloat(data.fee);
    } catch (err) { /* leave blank */ }

    // Category prices
    try {
      const res = await fetch(`${API_BASE}/participants/categories`);
      const categories = await res.json();
      const wrap = document.getElementById('category-rows');
      wrap.innerHTML = categories.map(c => `
        <div class="settings-row">
          <label>${c.name}</label>
          <input type="number" step="0.01" id="cat-price-${c.id}" value="${parseFloat(c.price)}" />
          <button class="small" onclick="saveCategoryPrice(${c.id})">Save</button>
        </div>
      `).join('');
    } catch (err) {
      document.getElementById('category-rows').innerHTML = '<p class="empty-note">Could not load categories.</p>';
    }
  }

  document.getElementById('fee-save').addEventListener('click', async () => {
    const feeMsg = document.getElementById('fee-msg');
    const fee = document.getElementById('fee-input').value;
    feeMsg.className = 'msg';

    try {
      const res = await fetch(`${API_BASE}/admin/settings/exhibitor-fee`, {
        method: 'PATCH',
        headers: authHeaders(),
        body: JSON.stringify({ fee: parseFloat(fee) }),
      });
      const data = await res.json();

      if (res.ok) {
        feeMsg.className = 'msg success';
        feeMsg.textContent = 'Exhibitor fee updated.';
      } else {
        feeMsg.className = 'msg error';
        feeMsg.textContent = data.error || 'Could not update fee.';
      }
    } catch (err) {
      feeMsg.className = 'msg error';
      feeMsg.textContent = 'Could not reach the server.';
    }
  });

  async function saveCategoryPrice(id) {
    const categoryMsg = document.getElementById('category-msg');
    const price = document.getElementById(`cat-price-${id}`).value;
    categoryMsg.className = 'msg';

    try {
      const res = await fetch(`${API_BASE}/admin/categories/${id}`, {
        method: 'PATCH',
        headers: authHeaders(),
        body: JSON.stringify({ price: parseFloat(price) }),
      });
      const data = await res.json();

      if (res.ok) {
        categoryMsg.className = 'msg success';
        categoryMsg.textContent = 'Category price updated.';
      } else {
        categoryMsg.className = 'msg error';
        categoryMsg.textContent = data.error || 'Could not update category.';
      }
    } catch (err) {
      categoryMsg.className = 'msg error';
      categoryMsg.textContent = 'Could not reach the server.';
    }
  }
</script>

</body>
</html>
